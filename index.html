<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Photo Share</title>
<style>
:root{
  --bg:#f6f5f2;--surface:#fff;--surface-2:#efede8;--text:#1d1c1a;--muted:#6b6862;--line:#dedbd4;
  --accent:#2f6f5e;--accent-text:#fff;--accent-soft:#e3efe9;--danger:#b3261e;--warn:#9a6200;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1e1d1b;--surface-2:#282723;--text:#ecebe7;--muted:#a19e97;--line:#36342f;
  --accent:#6fbfa6;--accent-text:#0e1f1a;--accent-soft:#1d322b;--danger:#f2a7a1;--warn:#e8b35a;--shadow:none;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1e1d1b;--surface-2:#282723;--text:#ecebe7;--muted:#a19e97;--line:#36342f;
  --accent:#6fbfa6;--accent-text:#0e1f1a;--accent-soft:#1d322b;--danger:#f2a7a1;--warn:#e8b35a;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);font-weight:600}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.me{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.me img{width:26px;height:26px;border-radius:50%}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
#auth,#pending{max-width:440px;margin:40px auto;padding:28px}
#auth h1,#pending h1{margin:0 0 6px;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:4px;margin:0 0 20px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
form.stack{display:grid;gap:14px}
form.stack .row{justify-content:space-between}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:14px}
.ok{color:var(--accent);font-size:14px;margin:0}
.lead{color:var(--muted);margin:0 0 20px}
label.field{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=password],input[type=search],input[type=email],input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.err{color:var(--danger);font-size:14px;margin:0}
.err:empty,.ok:empty{display:none}
details{margin-top:20px;font-size:14px;color:var(--muted)}
details summary{cursor:pointer;color:var(--text)}
details ol{padding-left:20px;margin:10px 0 0}
code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:13px}

#app{padding:20px 0 60px}
#drop{border:2px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;background:var(--surface);transition:.15s}
body.dragging #drop{border-color:var(--accent);background:var(--accent-soft)}
#drop p{margin:0 0 12px;color:var(--muted)}
#drop .row{justify-content:center}
.hint{font-size:13px;color:var(--muted)}

#queue{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
#queue li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
#queue .qn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#queue .qs{color:var(--muted);white-space:nowrap}
#queue li.work .qs{color:var(--accent)}
#queue li.done .qs{color:var(--accent);font-weight:600}
#queue li.fail .qs{color:var(--danger);white-space:normal;text-align:right}
#queueBar{margin-top:6px;text-align:right}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:22px 0 14px}
.toolbar .search{flex:1;min-width:180px}
select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.meter{display:flex;align-items:center;gap:8px}
.meter span.bar{width:90px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter span.bar i{display:block;height:100%;background:var(--accent)}
.meter.warn span.bar i{background:var(--warn)}

@media (max-width:520px){.brand small,#meName{display:none}.brand{font-size:16px}header .wrap{gap:6px}}
#selbar{position:sticky;top:64px;z-index:4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
#selbar strong{margin-right:auto}

#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
@media (max-width:520px){#grid{grid-template-columns:repeat(2,1fr);gap:8px}}
.tile{margin:0;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tile .thumb{display:block;width:100%;aspect-ratio:1;border:0;padding:0;background:var(--surface-2);position:relative}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.tile img.loaded{opacity:1}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase}
.tile figcaption{padding:8px 10px;font-size:13px;line-height:1.35}
.tile figcaption b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile figcaption span{color:var(--muted)}
.tile .tick{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);display:none;place-items:center;color:#fff;font-size:14px;font-weight:700}
body.selecting .tile .tick{display:grid}
.tile.selected{outline:3px solid var(--accent);outline-offset:-3px}
.tile.selected .tick{background:var(--accent);border-color:var(--accent)}
#empty{text-align:center;color:var(--muted);padding:48px 0}

#viewer{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#0d0d0c;color:#eee}
#viewer::backdrop{background:#0d0d0c}
#viewer[open]{display:flex;flex-direction:column}
.v-top{display:flex;align-items:center;gap:10px;padding:10px 16px}
.v-title{flex:1;min-width:0}
.v-title strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-title small{color:#a8a59f}
#viewer .btn{background:#262523;border-color:#3a3935;color:#eee}
#viewer .btn.danger{color:#f2a7a1}
.v-stage{flex:1;position:relative;display:grid;place-items:center;min-height:0;padding:0 8px 16px}
#vImg{max-width:100%;max-height:100%;object-fit:contain;user-select:none}
#vMsg{position:absolute;color:#a8a59f;font-size:14px}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:24px;line-height:1}
.v-nav:hover{background:rgba(255,255,255,.22)}
#vPrev{left:12px}#vNext{right:12px}

#members{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:0;width:min(94vw,560px);max-height:85vh;box-shadow:var(--shadow)}
#members::backdrop{background:rgba(0,0,0,.45)}
#members[open]{display:flex;flex-direction:column}
.m-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-size:17px;margin-right:auto}
#memberList{list-style:none;margin:0;padding:6px 16px 16px;overflow:auto}
#memberList li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
#memberList li:last-child{border-bottom:0}
.m-who{flex:1;min-width:0}
.m-who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-who small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted)}
.chip.pending{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.approved{background:var(--accent-soft);color:var(--accent)}
.chip.blocked{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.badge{background:var(--danger);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;min-width:18px;text-align:center}
#ask{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:22px;max-width:min(92vw,400px);box-shadow:var(--shadow)}
#ask::backdrop{background:rgba(0,0,0,.45)}
#ask p{margin:0 0 6px;font-weight:600}
#ask small{display:block;color:var(--muted);margin-bottom:18px}
#ask .row{justify-content:flex-end}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--surface);font-weight:600}
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:20;width:min(92vw,440px)}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:var(--shadow)}
.toast.error{background:var(--danger);color:#fff}
#status{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);z-index:15}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">📷 Photo Share</div>
  <button class="btn ghost" id="membersBtn" hidden>Members <span class="badge" id="pendingBadge" hidden></span></button>
  <span class="me" id="me" hidden><span id="meName"></span></span>
  <button class="btn ghost" id="signOutBtn" hidden>Sign out</button>
</div></header>

<main class="wrap">
  <p id="booting" class="hint" style="text-align:center;margin-top:60px">Loading…</p>

  <!-- Sign in / create account / reset password -->
  <section id="auth" class="card" hidden>
    <h1 id="authTitle">Welcome to the album</h1>
    <p class="lead" id="authLead">Sign in to see and share photos.</p>
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" id="tabIn" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="tabUp" aria-selected="false">Create account</button>
    </div>

    <form id="inForm" class="stack" novalidate>
      <div><label class="field" for="inEmail">Email</label><input id="inEmail" type="email" autocomplete="email" required></div>
      <div><label class="field" for="inPass">Password</label><input id="inPass" type="password" autocomplete="current-password" required></div>
      <div class="row">
        <label class="check"><input type="checkbox" id="remember" checked> Keep me signed in</label>
        <button class="btn primary" id="inBtn">Sign in</button>
      </div>
      <p class="err" id="inErr" role="alert"></p>
      <button type="button" class="linkish" id="forgotBtn" style="justify-self:start">Forgot password?</button>
    </form>

    <form id="upForm" class="stack" novalidate hidden>
      <div><label class="field" for="upName">Your name</label><input id="upName" type="text" autocomplete="name" maxlength="60" required placeholder="Shown next to the photos you add"></div>
      <div><label class="field" for="upEmail">Email</label><input id="upEmail" type="email" autocomplete="email" required></div>
      <div><label class="field" for="upPass">Password</label><input id="upPass" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div>
      <p class="hint" style="margin:0">The album owner approves new accounts before they can see photos.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn primary" id="upBtn">Create account</button></div>
      <p class="err" id="upErr" role="alert"></p>
      <p class="ok" id="upOk" role="status"></p>
    </form>

    <form id="forgotForm" class="stack" novalidate hidden>
      <div><label class="field" for="fgEmail">Email</label><input id="fgEmail" type="email" autocomplete="email" required></div>
      <div class="row"><button type="button" class="linkish" id="backToIn">Back to sign in</button><button class="btn primary" id="fgBtn">Send reset link</button></div>
      <p class="err" id="fgErr" role="alert"></p>
      <p class="ok" id="fgOk" role="status"></p>
    </form>

    <form id="resetForm" class="stack" novalidate hidden>
      <div><label class="field" for="newPass">New password</label><input id="newPass" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div>
      <div class="row" style="justify-content:flex-end"><button class="btn primary" id="resetBtn">Save new password</button></div>
      <p class="err" id="resetErr" role="alert"></p>
    </form>
  </section>

  <!-- Signed in but not approved yet -->
  <section id="pending" class="card" hidden>
    <h1 id="pendingTitle">Almost in</h1>
    <p class="lead" id="pendingText"></p>
    <div class="row"><button class="btn primary" id="recheckBtn">Check again</button><button class="btn ghost" id="pendingOut">Sign out</button></div>
  </section>

  <!-- The album -->
  <section id="app" hidden>
    <div id="drop">
      <p>Drop photos anywhere on this page, paste them, or</p>
      <div class="row">
        <button class="btn primary" id="pickBtn">Choose photos</button>
        <input type="file" id="fileInput" accept="image/*,.heic,.heif" multiple hidden>
      </div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <label class="check" title="Resizes and re-saves as JPEG, which also removes hidden location (GPS) data. GIFs are never changed."><input type="checkbox" id="optimize" checked><span>Optimize photos (max <span id="maxDimLbl"></span>px, removes location data)</span></label>
      </div>
    </div>
    <ul id="queue" aria-live="polite"></ul>
    <div id="queueBar" hidden><button class="btn ghost" id="clearQueue">Clear finished</button></div>

    <div class="toolbar">
      <input class="search" type="search" id="search" placeholder="Search by file name or person" aria-label="Search photos">
      <select id="sort" aria-label="Sort order"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select>
      <button class="btn" id="selectBtn">Select</button>
      <button class="btn" id="dlAllBtn">Download all</button>
      <button class="btn ghost" id="refreshBtn" title="Refresh" aria-label="Refresh">⟳</button>
    </div>
    <div class="meta"><span id="count"></span><span class="meter" id="meter" title="Free plan storage"><span id="meterTxt"></span><span class="bar"><i id="meterBar"></i></span></span></div>

    <div id="selbar" hidden>
      <strong id="selCount">0 selected</strong>
      <button class="btn ghost" id="selAll">Select all</button>
      <button class="btn" id="selDl">Download</button>
      <button class="btn danger" id="selDel">Delete</button>
      <button class="btn primary" id="selDone">Done</button>
    </div>

    <div id="grid"></div>
    <p id="empty" hidden></p>
  </section>
</main>

<dialog id="viewer" aria-label="Photo viewer">
  <div class="v-top">
    <div class="v-title"><strong id="vName"></strong><small id="vMeta"></small></div>
    <button class="btn" id="vDl">Download</button>
    <button class="btn danger" id="vDel">Delete</button>
    <button class="btn" id="vClose" aria-label="Close">✕</button>
  </div>
  <div class="v-stage">
    <img id="vImg" alt="">
    <span id="vMsg"></span>
    <button class="v-nav" id="vPrev" aria-label="Previous photo">‹</button>
    <button class="v-nav" id="vNext" aria-label="Next photo">›</button>
  </div>
</dialog>

<dialog id="members" aria-label="Members">
  <div class="m-head"><h2>Members</h2><button class="btn ghost" id="mRefresh" aria-label="Refresh">⟳</button><button class="btn" id="mClose">Close</button></div>
  <ul id="memberList"></ul>
</dialog>

<dialog id="ask">
  <form method="dialog">
    <p id="askMsg"></p><small id="askSub"></small>
    <div class="row"><button class="btn" value="no">Cancel</button><button class="btn danger-fill" id="askOk" value="yes">OK</button></div>
  </form>
</dialog>

<div id="toasts" aria-live="assertive"></div>
<div id="status" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"
        integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script>
'use strict';
/* ================= CONFIG ================= */
const CONFIG = {
  url: 'https://khslwzgcdyvpqcswqpil.supabase.co',
  // Publishable key: designed to be public. The database access rules (supabase/setup.sql) protect the data.
  key: 'sb_publishable_K0d5DE_434O6K7ehulboBQ_uBt5L14H',
  bucket: 'photos',
  maxDim: 2560,          // "Optimize" resizes the long edge to this many pixels
  jpegQuality: 0.85,
  thumbDim: 480,
  maxFileMB: 50,         // matches the storage bucket limit
  storageGB: 1,          // Supabase free plan file storage
  pollSeconds: 120       // backup refresh in case live updates are blocked
};
/* ========================================== */

const $ = id => document.getElementById(id);
const IMG_EXT = /\.(jpe?g|png|gif|webp|avif|heic|heif|bmp)$/i;
const MIME = { jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', gif:'image/gif', webp:'image/webp',
  avif:'image/avif', heic:'image/heic', heif:'image/heif', bmp:'image/bmp' };
const ALLOWED = new Set(Object.values(MIME));
const REMEMBER_KEY = 'photoshare:remember';

const state = {
  session: null, profile: null, photos: [], view: [], bytes: 0,
  selected: new Set(), selecting: false, queue: [], uploading: false, busy: 0,
  loading: false, reloadPending: false, loadedOnce: false, channel: null, pollTimer: null,
  urls: new Map(), vi: -1, vToken: 0, recovering: false
};

/* ---------- small helpers ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch { return null; } },
  set(k, v, persist) { try { (persist ? localStorage : sessionStorage).setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch {} }
};
const remember = () => store.get(REMEMBER_KEY) !== '0';
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const extOf = name => (name.match(/\.([^.]+)$/) || [, ''])[1].toLowerCase();
function fmtBytes(b) {
  if (b < 1024) return `${b} B`;
  const u = ['KB', 'MB', 'GB']; let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < 2);
  return `${b.toFixed(b < 10 ? 1 : 0)} ${u[i]}`;
}
const fmtDate = d => d ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function limiter(n) {
  let active = 0; const q = [];
  const next = () => {
    if (active >= n || !q.length) return;
    active++;
    const { fn, res, rej } = q.shift();
    Promise.resolve().then(fn).then(res, rej).finally(() => { active--; next(); });
  };
  return fn => new Promise((res, rej) => { q.push({ fn, res, rej }); next(); });
}
const net = limiter(4);
const siteUrl = () => location.origin + location.pathname;

function toast(msg, kind = '') {
  const t = el('div', `toast ${kind}`, msg);
  $('toasts').append(t);
  setTimeout(() => t.remove(), kind === 'error' ? 7000 : 3500);
}
function setStatus(msg) { $('status').textContent = msg || ''; $('status').hidden = !msg; }
function busy(on) { state.busy += on ? 1 : -1; }
function ask(msg, sub = '', ok = 'OK') {
  const d = $('ask');
  $('askMsg').textContent = msg; $('askSub').textContent = sub; $('askOk').textContent = ok;
  d.returnValue = '';
  d.showModal();
  return new Promise(res => d.addEventListener('close', () => res(d.returnValue === 'yes'), { once: true }));
}

// Turn Supabase / network errors into sentences people can act on.
function errMsg(e) {
  const code = e?.code || '';
  const m = String(e?.message || e || '');
  if (e instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(m))
    return "Can't reach the album server. Check your connection. If nobody has used the album for a week, the owner needs to resume it in Supabase.";
  if (code === 'invalid_credentials' || /invalid login credentials/i.test(m)) return 'Wrong email or password.';
  if (code === 'email_not_confirmed' || /email not confirmed/i.test(m)) return 'Confirm your email first. Check your inbox (and spam) for the link.';
  if (code === 'user_already_exists' || /already registered/i.test(m)) return 'That email already has an account. Sign in instead.';
  if (code === 'weak_password' || /password should/i.test(m)) return 'Choose a stronger password: at least 8 characters.';
  if (/rate limit/i.test(m) || code.startsWith('over_')) return 'Too many attempts. Wait a few minutes and try again.';
  if (/row-level security|not authorized|permission denied|Unauthorized/i.test(m)) return "You don't have permission to do that.";
  if (/exceeded the maximum allowed size|payload too large/i.test(m)) return `Too large. The limit is ${CONFIG.maxFileMB} MB; try with Optimize on.`;
  if (/mime type/i.test(m)) return 'That file type isn’t allowed. Use JPEG, PNG, GIF, WebP, AVIF or HEIC.';
  return m || 'Something went wrong. Try again.';
}

/* ---------- Supabase client ---------- */
// Session goes to localStorage ("keep me signed in") or sessionStorage (until the tab closes).

/* ---------- auth flow ---------- */
// Supabase warns against awaiting its own calls inside this callback, so defer the work.
sb.auth.onAuthStateChange((event, session) => setTimeout(() => onAuth(event, session), 0));

async function onAuth(event, session) {
  if (event === 'PASSWORD_RECOVERY') { state.recovering = true; state.session = session; authMode('reset'); show('auth'); return; }
  if (state.recovering) { // stay on the new-password form until it's saved
    if (!session) { state.recovering = false; showAuth('forgot'); $('fgErr').textContent = 'That reset link has expired. Request a new one.'; }
    return;
  }
  if (!session) { state.session = null; showAuth('in'); return; }
  const sameUser = state.session?.user?.id === session.user.id && state.profile;
  state.session = session;
  if (!sameUser) await loadProfile();
}

async function loadProfile() {
  const uid = state.session.user.id;
  const { data, error } = await sb.from('profiles').select('id,display_name,email,status,is_admin').eq('id', uid).maybeSingle();
  if (state.recovering) return;
  if (error) { toast(errMsg(error), 'error'); showAuth('in'); return; }
  if (!data) {
    $('pendingTitle').textContent = 'Account not set up';
    $('pendingText').textContent = "Your sign-in worked, but the album has no member record for you. Ask the album owner to check the database setup.";
    show('pending'); return;
  }
  state.profile = data;
  if (data.status === 'approved') {
    $('meName').textContent = data.display_name;
    show('app');
    await loadPhotos();
    startLive();
    if (data.is_admin) refreshPendingCount();
  } else {
    teardown();
    $('pendingTitle').textContent = data.status === 'blocked' ? 'Access turned off' : 'Almost in';
    $('pendingText').textContent = data.status === 'blocked'
      ? 'The album owner has turned off access for this account.'
      : `Thanks, ${data.display_name}. Your account is waiting for the album owner to approve it. Check back soon.`;
    $('recheckBtn').hidden = data.status === 'blocked';
    show('pending');
  }
}

function teardown() {
  if (state.channel) { sb.removeChannel(state.channel); state.channel = null; }
  clearInterval(state.pollTimer); state.pollTimer = null;
  Object.assign(state, { photos: [], view: [], loadedOnce: false, selected: new Set(), urls: new Map() });
  $('grid').replaceChildren();

}

/* ---------- loading the album ---------- */
function toPhoto(r) {
  const ext = extOf(r.file_name) || extOf(r.path);
  return { id: r.id, path: r.path, thumbPath: r.thumb_path, display: r.file_name, size: r.size_bytes || 0,
    type: r.content_type || MIME[ext] || 'application/octet-stream', ext,
    uploaderId: r.uploader, uploader: r.uploader_name || 'Former member', date: new Date(r.created_at) };
}

async function fetchAllPhotos() {
  const rows = [];
  for (let from = 0; ; from += 1000) { // the API returns at most 1000 rows per request
    const { data, error } = await sb.from('photos')
      .select('id,path,thumb_path,file_name,content_type,size_bytes,uploader,uploader_name,created_at')
      .order('created_at', { ascending: false }).range(from, from + 999);
    if (error) throw error;
    rows.push(...data);
    if (data.length < 1000) return rows;
  }
}

async function loadPhotos(quiet = false) {
  if (state.loading) { state.reloadPending = true; return; }
  state.loading = true;
  if (!quiet) setStatus('Loading photos…');
  try {
    const photos = (await fetchAllPhotos()).map(toPhoto);
    if (state.loadedOnce) { // tell people when someone else added photos
      const before = new Set(state.photos.map(p => p.id));
      const fresh = photos.filter(p => !before.has(p.id) && p.uploaderId !== state.session?.user.id);
      if (fresh.length) toast(`${plural(fresh.length, 'new photo')} from ${[...new Set(fresh.map(p => p.uploader))].join(', ')}`);
    }
    state.loadedOnce = true;
    state.photos = photos;
    state.bytes = photos.reduce((s, p) => s + p.size + (p.thumbPath ? 40000 : 0), 0); // thumbnails ≈ 40 KB each
    render();
  } catch (e) {
    if (!quiet) toast(errMsg(e), 'error'); else console.warn(e);
  } finally {
    state.loading = false;
    if (!quiet) setStatus('');
    if (state.reloadPending) { state.reloadPending = false; loadPhotos(true); }
  }
}

// Live updates: the database tells open pages when photos are added or removed.
function startLive() {
  if (state.channel) return;
  let t = null;
  state.channel = sb.channel('photos-feed')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'photos' }, () => {
      clearTimeout(t); t = setTimeout(() => { if (!state.uploading) loadPhotos(true); }, 700);
    })
    .subscribe();
  clearInterval(state.pollTimer);
  state.pollTimer = setInterval(() => {
    if (document.visibilityState !== 'visible' || state.uploading || state.busy) return;
    loadPhotos(true);
    if (state.profile?.is_admin) refreshPendingCount();
  }, CONFIG.pollSeconds * 1000);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.profile?.status === 'approved' && !state.uploading) loadPhotos(true);
});

// Private files are opened through short-lived signed links. Requests are batched:
// one call signs every preview that scrolls into view at about the same time.
const signer = (() => {
  let pending = new Map(), timer = null;
  async function flush() {
    const batch = pending; pending = new Map();
    const paths = [...batch.keys()];
    for (let i = 0; i < paths.length; i += 100) {
      const chunk = paths.slice(i, i + 100);
      try {
        const { data, error } = await bucket().createSignedUrls(chunk, 3600);
        if (error) throw error;
        for (const item of data) {
          const waiters = batch.get(item.path) || [];
          if (item.signedUrl) {
            state.urls.set(item.path, { url: item.signedUrl, exp: Date.now() + 50 * 60 * 1000 });
            waiters.forEach(w => w.res(item.signedUrl));
          } else waiters.forEach(w => w.rej(new Error(item.error || 'Missing file')));
          batch.delete(item.path);
        }
        for (const p of chunk) (batch.get(p) || []).forEach(w => w.rej(new Error('Missing file')));
      } catch (e) {
        for (const p of chunk) (batch.get(p) || []).forEach(w => w.rej(e));
      }
    }
  }
  return path => {
    const c = state.urls.get(path);
    if (c && c.exp > Date.now()) return Promise.resolve(c.url);
    return new Promise((res, rej) => {
      if (!pending.has(path)) pending.set(path, []);
      pending.get(path).push({ res, rej });
      clearTimeout(timer); timer = setTimeout(flush, 40);
    });
  };
})();

/* ---------- gallery ---------- */
const lazy = new IntersectionObserver(entries => {
  for (const en of entries) {
    if (!en.isIntersecting) continue;
    lazy.unobserve(en.target);
    const { img, p, ph } = en.target._ps;
    const path = p.thumbPath || (p.size <= 8 * 1024 * 1024 ? p.path : null); // don't pull huge originals into the grid
    if (!path) { ph.hidden = false; continue; }
    signer(path).then(u => { img.src = u; }).catch(() => { ph.hidden = false; });
  }
}, { rootMargin: '400px' });

function visiblePhotos() {
  const q = $('search').value.trim().toLowerCase();
  let list = state.photos.filter(p => !q || p.display.toLowerCase().includes(q) || p.uploader.toLowerCase().includes(q));
  if ($('sort').value === 'oldest') list = list.slice().reverse();
  return list;
}
const canDelete = p => p.uploaderId === state.session?.user.id || !!state.profile?.is_admin;

function tile(p, i) {
  const fig = el('figure', 'tile');
  if (state.selected.has(p.id)) fig.classList.add('selected');
  const btn = el('button', 'thumb');
  btn.type = 'button';
  btn.setAttribute('aria-label', `Open ${p.display}`);
  const img = el('img'); img.alt = ''; img.decoding = 'async';
  img.onload = () => img.classList.add('loaded');
  const ph = el('span', 'ph', p.ext || 'file'); ph.hidden = true;
  img.onerror = () => { ph.hidden = false; };
  btn.append(img, ph, el('span', 'tick', '✓'));
  btn.onclick = () => state.selecting ? toggleSelect(p, fig) : openViewer(i);
  const cap = el('figcaption');
  cap.append(el('b', '', p.display), el('span', '', [p.uploader, fmtDate(p.date)].filter(Boolean).join(' · ')));
  fig.append(btn, cap);
  btn._ps = { img, p, ph };
  lazy.observe(btn);
  return fig;
}

function render() {
  const list = visiblePhotos();
  state.view = list;
  const ids = new Set(state.photos.map(p => p.id));
  for (const s of state.selected) if (!ids.has(s)) state.selected.delete(s);
  lazy.disconnect();
  $('grid').replaceChildren(...list.map(tile));
  $('empty').hidden = list.length > 0;
  $('empty').textContent = state.photos.length ? 'No photos match your search.' : 'No photos yet. Add the first ones above.';
  $('count').textContent = plural(state.photos.length, 'photo');
  const limit = CONFIG.storageGB * 1024 ** 3;
  const pct = Math.min(100, state.bytes / limit * 100);
  $('meterTxt').textContent = `${fmtBytes(state.bytes)} of ${CONFIG.storageGB} GB`;
  $('meterBar').style.width = pct + '%';
  $('meter').classList.toggle('warn', pct > 80);
  $('dlAllBtn').disabled = !list.length;
  updateSelBar();
}

/* ---------- selection ---------- */
function setSelecting(on) {
  state.selecting = on;
  document.body.classList.toggle('selecting', on);
  if (!on) { state.selected.clear(); document.querySelectorAll('.tile.selected').forEach(t => t.classList.remove('selected')); }
  updateSelBar();
}
function toggleSelect(p, fig) {
  if (state.selected.has(p.id)) state.selected.delete(p.id); else state.selected.add(p.id);
  fig.classList.toggle('selected', state.selected.has(p.id));
  updateSelBar();
}
function updateSelBar() {
  $('selbar').hidden = !state.selecting;
  $('selectBtn').hidden = state.selecting;
  const sel = selectedPhotos();
  $('selCount').textContent = `${sel.length} selected`;
  $('selDl').disabled = !sel.length;
  $('selDel').disabled = !sel.some(canDelete);
}
const selectedPhotos = () => state.photos.filter(p => state.selected.has(p.id));

/* ---------- uploading ---------- */
function isImage(f) {
  if (f.type === 'image/svg+xml' || /\.svg$/i.test(f.name)) return false;
  return f.type.startsWith('image/') || IMG_EXT.test(f.name);
}

async function decode(file) {
  if ('createImageBitmap' in window) {
    try {
      const b = await createImageBitmap(file, { imageOrientation: 'from-image' });
      return { image: b, width: b.width, height: b.height, close: () => b.close() };
    } catch {}
  }
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    return { image: img, width: img.naturalWidth, height: img.naturalHeight, close: () => URL.revokeObjectURL(url) };
  } catch {
    URL.revokeObjectURL(url);
    return null; // e.g. HEIC in Chrome: uploaded as-is, no preview
  }
}

async function draw(src, scale, type, quality) {
  const w = Math.max(1, Math.round(src.width * scale)), h = Math.max(1, Math.round(src.height * scale));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); } // transparent PNG → white, not black
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src.image, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, type, quality));
  c.width = c.height = 0; // free canvas memory right away (matters on phones)
  if (!blob) throw new Error('Could not process this image.');
  return { blob, width: w, height: h };
}

async function prepare(file) {
  let ext = extOf(file.name) || (file.type.split('/')[1] || 'jpg').toLowerCase();
  let type = file.type || MIME[ext] || '';
  let main = file, width = null, height = null, thumb = null;
  const src = await decode(file);
  if (src) {
    try {
      width = src.width; height = src.height;
      if ($('optimize').checked && type !== 'image/gif') {
        const scale = Math.min(1, CONFIG.maxDim / Math.max(src.width, src.height));
        if (type === 'image/png') { if (scale < 1) ({ blob: main, width, height } = await draw(src, scale, 'image/png')); }
        else { ({ blob: main, width, height } = await draw(src, scale, 'image/jpeg', CONFIG.jpegQuality)); ext = 'jpg'; type = 'image/jpeg'; }
      }
      thumb = (await draw(src, Math.min(1, CONFIG.thumbDim / Math.max(src.width, src.height)), 'image/jpeg', 0.78)).blob;
    } finally { src.close(); }
  }
  if (ext === 'jpeg') ext = 'jpg';
  if (!ALLOWED.has(type)) throw new Error('That file type isn’t supported.');
  if (main.size > CONFIG.maxFileMB * 1024 * 1024)
    throw new Error(`Too large (${fmtBytes(main.size)}). The limit is ${CONFIG.maxFileMB} MB; try with Optimize on.`);
  const base = file.name.replace(/\.[^.]*$/, '').replace(/[\u0000-\u001f\\/]+/g, ' ').trim().slice(0, 100) || 'Photo';
  return { main, thumb, type, ext, width, height, name: `${base}.${ext}` };
}

async function uploadOne(it) {
  const uid = state.session.user.id;
  it.set('Preparing…', 'work');
  const prep = await prepare(it.file);
  const id = crypto.randomUUID();
  const path = `${uid}/${id}.${prep.ext}`;
  const thumbPath = prep.thumb ? `${uid}/thumbs/${id}.jpg` : null;
  it.set('Uploading…', 'work');
  const put = (p, blob, type) => net(async () => {
    const { error } = await bucket().upload(p, blob, { contentType: type, upsert: false, cacheControl: '31536000' });
    if (error) throw error;
  });
  try {
    await Promise.all([put(path, prep.main, prep.type), thumbPath ? put(thumbPath, prep.thumb, 'image/jpeg') : null]);
    const { error } = await sb.from('photos').insert({ path, thumb_path: thumbPath, file_name: prep.name,
      content_type: prep.type, size_bytes: prep.main.size, width: prep.width, height: prep.height });
    if (error) throw error;
  } catch (e) {
    bucket().remove([path, thumbPath].filter(Boolean)).catch(() => {}); // don't leave orphan files behind
    throw e;
  }
}

function queueItem(file) {
  const li = el('li');
  const st = el('span', 'qs', 'Waiting…');
  li.append(el('span', 'qn', file.name), el('span', 'hint', fmtBytes(file.size)), st);
  $('queue').append(li);
  const it = {
    file, li,
    set(text, kind) { st.textContent = text; li.className = kind || ''; },
    fail(msg) {
      it.set(`Failed: ${msg}`, 'fail');
      const retry = el('button', 'btn', 'Retry');
      retry.onclick = () => { retry.remove(); it.set('Waiting…'); state.queue.push(it); runUploads(); };
      li.append(retry);
      updateQueueBar();
    }
  };
  return it;
}
function updateQueueBar() { $('queueBar').hidden = !$('queue').querySelector('li.done, li.fail'); }

function handleFiles(files) {
  if (state.profile?.status !== 'approved') return;
  const all = [...files];
  const picked = all.filter(isImage);
  if (all.length > picked.length) toast(`${plural(all.length - picked.length, 'file')} skipped: only photos can be added.`);
  if (!picked.length) return;
  state.queue.push(...picked.map(queueItem));
  runUploads();
}

async function runUploads() {
  if (state.uploading) return;
  state.uploading = true;
  let added = 0;
  const work = limiter(2); // two photos at a time keeps phones responsive
  try {
    const jobs = [];
    while (state.queue.length) {
      const it = state.queue.shift();
      jobs.push(work(async () => {
        try { await uploadOne(it); it.set('Added ✓', 'done'); added++; }
        catch (e) { it.fail(errMsg(e)); }
      }));
      if (!state.queue.length) { await Promise.all(jobs.splice(0)); } // pick up files dropped mid-upload
    }
  } finally {
    state.uploading = false;
    updateQueueBar();
    if (added) await loadPhotos(true);
  }
}

/* ---------- deleting ---------- */
async function deletePhotos(list) {
  const mine = list.filter(canDelete);
  if (!mine.length) return toast('You can only delete photos you added.', 'error');
  const n = mine.length, skipped = list.length - n;
  const sub = skipped ? `${plural(skipped, 'photo')} added by others will be kept.` : 'This can’t be undone.';
  if (!(await ask(`Delete ${plural(n, 'photo')} for everyone?`, sub, 'Delete'))) return;
  busy(true); setStatus(`Deleting ${plural(n, 'photo')}…`);
  try {
    const { data, error } = await sb.from('photos').delete().in('id', mine.map(p => p.id)).select('id,path,thumb_path');
    if (error) throw error;
    const files = data.flatMap(r => [r.path, r.thumb_path]).filter(Boolean);
    if (files.length) await bucket().remove(files);
    setSelecting(false);
    if ($('viewer').open) $('viewer').close();
    await loadPhotos(true);
    toast(`Deleted ${plural(data.length, 'photo')}.`);
  } catch (e) {
    toast(errMsg(e), 'error');
  } finally { busy(false); setStatus(''); }
}

/* ---------- downloading ---------- */
async function downloadOne(p) {
  try {
    // A signed link with download=name makes the browser save the file directly, without loading it into the page.
    const { data, error } = await bucket().createSignedUrl(p.path, 120, { download: p.display });
    if (error) throw error;
    const a = el('a'); a.href = data.signedUrl; a.rel = 'noopener';
    document.body.append(a); a.click(); a.remove();
  } catch (e) { toast(errMsg(e), 'error'); }
}

let zipLib;
function loadJSZip() {
  return zipLib ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
    s.integrity = 'sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG';
    s.crossOrigin = 'anonymous';
    s.onload = () => res(window.JSZip);
    s.onerror = () => { zipLib = null; rej(new Error('Could not load the ZIP helper. Download photos one at a time instead.')); };
    document.head.append(s);
  });
}
function saveBlob(blob, name) {
  const a = el('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}
async function downloadMany(list) {
  if (!list.length) return;
  if (list.length === 1) return downloadOne(list[0]);
  const total = list.reduce((s, p) => s + p.size, 0);
  if (total > 1024 ** 3 && !(await ask(`That's ${fmtBytes(total)} of photos.`, 'Very large ZIPs can fail on phones.', 'Download'))) return;
  busy(true);
  try {
    const JSZip = await loadJSZip();
    const zip = new JSZip(); const used = new Set(); let done = 0;
    setStatus(`Preparing ZIP… 0/${list.length}`);
    await Promise.all(list.map(p => net(async () => {
      const { data, error } = await bucket().download(p.path);
      if (error) throw error;
      let n = p.display, i = 2;
      while (used.has(n.toLowerCase())) n = p.display.replace(/(\.[^.]+)?$/, ` (${i++})$1`);
      used.add(n.toLowerCase());
      zip.file(n, data, { binary: true });
      setStatus(`Preparing ZIP… ${++done}/${list.length}`);
    })));
    // Photos are already compressed; STORE skips pointless re-compression and is much faster.
    const out = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    saveBlob(out, `photos-${new Date().toISOString().slice(0, 10)}.zip`);
  } catch (e) {
    toast(errMsg(e), 'error');
  } finally { busy(false); setStatus(''); }
}

/* ---------- viewer ---------- */
function openViewer(i) {
  state.vi = i;
  showInViewer();
  if (!$('viewer').open) $('viewer').showModal();
}
function showInViewer() {
  const p = state.view[state.vi]; if (!p) return;
  const token = ++state.vToken;
  $('vName').textContent = p.display;
  $('vMeta').textContent = [p.uploader, fmtDate(p.date), fmtBytes(p.size)].filter(Boolean).join(' · ');
  $('vPrev').hidden = state.vi <= 0;
  $('vNext').hidden = state.vi >= state.view.length - 1;
  $('vDel').hidden = !canDelete(p);
  const img = $('vImg');
  img.removeAttribute('src');
  const quick = p.thumbPath && state.urls.get(p.thumbPath);
  if (quick) img.src = quick.url; // small preview first, full size when it arrives
  $('vMsg').textContent = 'Loading…';
  img.onload = () => { if (token === state.vToken && img.src === state.vFull) $('vMsg').textContent = ''; };
  img.onerror = () => { if (token === state.vToken) $('vMsg').textContent = "This browser can't display this format. Use Download."; };
  signer(p.path).then(u => { if (token !== state.vToken) return; state.vFull = u; img.src = u; })
    .catch(e => { if (token === state.vToken) $('vMsg').textContent = errMsg(e); });
}
function step(d) {
  const n = state.vi + d;
  if (n >= 0 && n < state.view.length) { state.vi = n; showInViewer(); }
}

/* ---------- members (admin) ---------- */
async function refreshPendingCount() {
  const { data, error } = await sb.rpc('admin_list_members');
  if (error) return;
  const n = data.filter(m => m.status === 'pending').length;
  $('pendingBadge').textContent = n; $('pendingBadge').hidden = !n;
  return data;
}
async function openMembers() {
  if (!$('members').open) $('members').showModal();
  $('memberList').replaceChildren(el('li', 'hint', 'Loading…'));
  const { data, error } = await sb.rpc('admin_list_members');
  if (error) { $('memberList').replaceChildren(el('li', 'err', errMsg(error))); return; }
  const n = data.filter(m => m.status === 'pending').length;
  $('pendingBadge').textContent = n; $('pendingBadge').hidden = !n;
  $('memberList').replaceChildren(...data.map(memberRow));
}
function memberRow(m) {
  const li = el('li');
  const who = el('div', 'm-who');
  const me = m.id === state.session.user.id;
  who.append(el('b', '', m.display_name + (me ? ' (you)' : '')), el('small', '', `${m.email || ''} · joined ${fmtDate(new Date(m.created_at))}`));
  li.append(who, el('span', `chip ${m.status}`, m.is_admin ? 'admin' : m.status));
  if (!me) {
    const act = (label, status, cls = '') => {
      const b = el('button', `btn ${cls}`, label);
      b.onclick = async () => {
        if (status === 'blocked' && !(await ask(`Turn off access for ${m.display_name}?`, 'They will no longer see or add photos. You can turn it back on later.', 'Turn off'))) return;
        b.disabled = true;
        const { error } = await sb.rpc('set_member_status', { target: m.id, new_status: status });
        if (error) { toast(errMsg(error), 'error'); b.disabled = false; return; }
        toast(status === 'approved' ? `${m.display_name} can now use the album.` : `Access turned off for ${m.display_name}.`);
        openMembers();
      };
      return b;
    };
    if (m.status === 'pending') li.append(act('Approve', 'approved', 'primary'), act('Decline', 'blocked', 'danger'));
    else if (m.status === 'approved') li.append(act('Turn off', 'blocked', 'danger'));
    else li.append(act('Restore', 'approved'));
  }
  return li;
}
$('membersBtn').onclick = openMembers;
$('mRefresh').onclick = openMembers;
$('mClose').onclick = () => $('members').close();

/* ---------- wiring ---------- */
$('pickBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { handleFiles(e.target.files); e.target.value = ''; };
$('clearQueue').onclick = () => { $('queue').querySelectorAll('li.done, li.fail').forEach(li => li.remove()); updateQueueBar(); };
$('search').oninput = render;
$('sort').onchange = render;
$('refreshBtn').onclick = () => loadPhotos();
$('selectBtn').onclick = () => setSelecting(true);
$('selDone').onclick = () => setSelecting(false);
$('selAll').onclick = () => { state.view.forEach(p => state.selected.add(p.id)); render(); };
$('selDl').onclick = () => downloadMany(selectedPhotos());
$('selDel').onclick = () => deletePhotos(selectedPhotos());
$('dlAllBtn').onclick = () => downloadMany(state.view);
$('vClose').onclick = () => $('viewer').close();
$('vPrev').onclick = () => step(-1);
$('vNext').onclick = () => step(1);
$('vDl').onclick = () => { const p = state.view[state.vi]; if (p) downloadOne(p); };
$('vDel').onclick = () => { const p = state.view[state.vi]; if (p) deletePhotos([p]); };
$('viewer').addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
$('viewer').addEventListener('close', () => { state.vToken++; $('vImg').removeAttribute('src'); });
let touchX = null;
$('viewer').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
$('viewer').addEventListener('touchend', e => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
});

// Drag & drop anywhere, and Ctrl+V of screenshots / copied images
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
let dragDepth = 0;
window.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; document.body.classList.add('dragging'); } });
window.addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  handleFiles(e.dataTransfer.files);
});
document.addEventListener('paste', e => {
  if (state.profile?.status !== 'approved' || e.target.matches('input')) return;
  const files = [...(e.clipboardData?.items || [])].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
  if (files.length) handleFiles(files);
});
window.addEventListener('beforeunload', e => {
  if (state.uploading || state.queue.length) { e.preventDefault(); e.returnValue = ''; }
});

$('optimize').checked = store.get('photoshare:optimize') !== '0';
$('optimize').onchange = e => store.set('photoshare:optimize', e.target.checked ? '1' : '0', true);
$('maxDimLbl').textContent = CONFIG.maxDim;
$('remember').checked = remember();

// If no auth event arrives (e.g. storage blocked), fall back to the sign-in screen.
setTimeout(() => { if (!$('booting').hidden) showAuth('in'); }, 6000);
</script>
